<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoNavi · PostgreSQL</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ═══════════════ 启动页 / 数据源选择（Postgres 按钮） ═══════════════ -->
  <div id="launcher" class="launcher">
    <div class="launch-card">
      <div class="launch-brand">
        <span class="logo-mark">G</span>
        <div>
          <div class="brand-name">GoNavi</div>
          <div class="brand-sub">Modern Lightweight Database Client</div>
        </div>
      </div>
      <div class="launch-title">选择数据源</div>
      <div class="launch-sub">点击 <b>PostgreSQL</b> 按钮，自动连接本机 Postgres 并打开工作台</div>
      <div class="ds-grid">
        <button class="ds-tile active" id="btnPostgres" data-type="postgres">
          <span class="ds-ico" id="pgIco"></span>
          <span class="ds-name">PostgreSQL</span>
          <span class="ds-meta">localhost:5432 · postgres</span>
          <span class="ds-badge">内置 · 一键连接</span>
        </button>
        <button class="ds-tile disabled" disabled>
          <span class="ds-ico dim">◧</span>
          <span class="ds-name">MySQL</span>
          <span class="ds-meta">即将支持</span>
        </button>
        <button class="ds-tile disabled" disabled>
          <span class="ds-ico dim">◆</span>
          <span class="ds-name">Redis</span>
          <span class="ds-meta">即将支持</span>
        </button>
        <button class="ds-tile disabled" disabled>
          <span class="ds-ico dim">○</span>
          <span class="ds-name">Oracle</span>
          <span class="ds-meta">即将支持</span>
        </button>
      </div>
      <div class="launch-foot">连接信息：postgresql://postgres@127.0.0.1:5432/postgres</div>
    </div>
  </div>

  <!-- ═══════════════ 主工作台 ═══════════════ -->
  <div id="app" class="app hidden">
    <!-- 标题栏 -->
    <div class="titlebar">
      <div class="tb-left">
        <span class="logo-mark sm">G</span>
        <span class="tb-title">GoNavi</span>
      </div>
      <div class="tb-right">
        <span class="winbtn">—</span>
        <span class="winbtn">▢</span>
        <span class="winbtn danger">✕</span>
      </div>
    </div>
    <!-- 工具栏 -->
    <div class="toolbar">
      <button class="tbtn" id="tbTools"><span class="tico tb-i" data-ico="tools"></span>工具</button>
      <button class="tbtn" id="tbProxy"><span class="tico tb-i" data-ico="globe"></span>代理</button>
      <button class="tbtn" id="tbTheme"><span class="tico tb-i" data-ico="skin"></span>主题</button>
      <button class="tbtn" id="tbAbout"><span class="tico tb-i" data-ico="info"></span>关于</button>
      <div class="tb-flex"></div>
      <div class="conn-pill" id="connPill"><span class="dot"></span><span id="connPillText">未连接</span></div>
      <button class="tbtn create-conn" id="tbPostgres">＋ PostgreSQL</button>
    </div>

    <!-- 主体 -->
    <div class="main">
      <!-- 左侧栏 -->
      <aside class="sider">
        <div class="sider-tools">
          <button class="iconbtn" id="btnNewQuery" title="新建查询"><span class="tico" id="newQueryIco"></span></button>
          <button class="iconbtn" id="btnNewConn" title="新建连接">＋</button>
          <div class="tb-flex"></div>
          <button class="iconbtn" id="btnRefresh" title="刷新对象">⟳</button>
        </div>
        <div class="sider-search">
          <input id="treeSearch" placeholder="搜索表 / 视图 / 函数…" />
        </div>
        <div class="tree-scroll"><div id="tree" class="tree"></div></div>
        <div class="sider-foot">
          <button class="logbtn" id="btnLog">SQL 执行日志</button>
        </div>
      </aside>

      <!-- 右侧内容 -->
      <section class="content">
        <div class="tabbar" id="tabbar"></div>
        <div class="workspace" id="workspace"></div>
      </section>
    </div>

    <!-- 日志抽屉 -->
    <div id="logDrawer" class="log-drawer hidden">
      <div class="log-head"><span>SQL 执行日志</span><span class="iconbtn" id="logClose">✕</span></div>
      <div id="logBody" class="log-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="./datagrid.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
